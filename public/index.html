<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaxity Upload</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="card"><h1>Gaxity <span>Upload</span></h1><p>Simple, fast file sharing.</p><label class="drop" id="drop"><input id="file" type="file"><div class="drop-icon">↑</div><b class="drop-title">Choose a file</b><small class="drop-sub">or drag and drop</small></label><p class="hint">One file per upload • No account or API key required.</p><label class="row"><span>Expiration</span><select id="expires"><option value="0">Never</option><option value="3600">1 hour</option><option value="21600">6 hours</option><option value="43200">12 hours</option><option value="86400">1 day</option><option value="259200">3 days</option><option value="604800">7 days</option><option value="2592000">30 days</option></select></label><button id="upload" disabled>Upload file</button><p id="status"></p><div id="results"></div><footer>© <span id="year"></span> Gaxity Platform, Powered by Gaxity Cloud</footer></section></main><script src="/app.js"></script></body></html>
